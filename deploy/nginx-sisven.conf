# Sisven Cont — reverse proxy nginx
#
# Instalación:
#   1. Reemplaza "sisven.TUDOMINIO.COM" por tu subdominio real.
#   2. sudo cp deploy/nginx-sisven.conf /etc/nginx/sites-available/sisven
#   3. sudo ln -s /etc/nginx/sites-available/sisven /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d sisven.TUDOMINIO.COM   (activa HTTPS)

server {
    listen 80;
    server_name sisven.TUDOMINIO.COM;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }
}
